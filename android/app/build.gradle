plugins {
    id 'com.android.application'
}

def runNumber = System.getenv("GITHUB_RUN_NUMBER")

android {
    namespace 'com.fahimalsifat.newscard'
    compileSdk 34

    defaultConfig {
        applicationId "com.fahimalsifat.newscard"
        minSdk 21
        targetSdk 34
        versionCode runNumber ? runNumber.toInteger() : 1
        versionName "1.0." + (runNumber ?: "0")
        resValue "string", "app_name", "NewsCard Studio"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
